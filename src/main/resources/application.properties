spring.application.name=student-attendance
server.port=8080
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
